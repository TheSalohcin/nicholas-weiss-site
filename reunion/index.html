<title>Reunion check-in</title><style>
:root{

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--cream);

body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:620px;margin:0 auto;padding:18px 16px 96px}
.eyebrow{font-family:Georgia,"Times New Roman",serif;font-style:italic;

h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0 0 12px}
.tally{display:flex;align-items:baseline;gap:10px;font-size:14px;color:var(--mute);margin-bottom:8px}

.bar{height:5px;border-radius:3px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--here);transition:width .28s ease}
.controls{position:sticky;top:0;z-index:5;background:var(--ink);padding:14px 0 10px;margin-top:14px}
input[type=search]{width:100%;padding:14px;font-size:17px;border-radius:12px;

input[type=search]::placeholder{color:#6d7c90}

.tabs{display:flex;gap:8px;margin-top:10px}

  font-family:inherit}
.tab[aria-selected=true]{background:var(--cream);color:var(--ink);border-color:var(--cream)}

ul{list-style:none;margin:10px 0 0;padding:0}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;

  border-radius:12px;padding:12px;margin-bottom:8px;min-height:62px;color:inherit;font:inherit}
.row:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.row.gold{border-left-color:var(--gold)} .row.red{border-left-color:var(--red)}
.row.navy{border-left-color:var(--slate)}
.row.on{background:#16241c;border-color:#2c4735;border-left-color:var(--here)}
.row.on .nm{color:var(--here)}
.tick{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);
  display:grid;place-items:center;font-size:15px;font-weight:800;color:transparent}
.row.on .tick{background:var(--here);border-color:var(--here);color:#0e1a12}
.who{flex:1;min-width:0}
.nm{font-size:16px;font-weight:800;letter-spacing:.01em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12.5px;color:var(--mute);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta em{font-family:Georgia,serif;font-style:italic;color:#a9b6c8}
.loc{flex:none;display:flex;align-items:center;gap:7px}
.loc .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;

.loc .mono b{display:block;color:var(--cream);font-size:12px;letter-spacing:-.01em}
.loc .mono i{display:block;font-style:normal;color:#7d8da0}
svg.grid{display:block}
.empty{text-align:center;color:var(--mute);padding:34px 16px;font-size:15px;line-height:1.5}
.empty b{color:var(--cream);display:block;margin-bottom:4px;font-size:16px}
footer{margin-top:22px;border-top:1px solid var(--line);padding-top:16px;

.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{padding:10px 14px;font-size:13px;font-weight:700;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--cream);font-family:inherit}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.warn{color:var(--red);border-color:#4a2a27}
.note{margin-top:12px;padding:10px 12px;border-radius:9px;background:#2a2418;
  border:1px solid #4a3f22;color:#e6d5a8;font-size:12.5px;display:none}
.panel{display:none;margin-top:12px}

.panel p{margin:6px 0 0;font-size:12px}

</style></head><body>

</div>

s","code":"ARROWS-106","word":"ARROWS","sheet":14,"row":1,"col":"R","slot":1}];
const BLANKS = [{"n":"063","sheet":8,"row":4,"col":"L","slot":6},{"n":"105","sheet":14,"row":1,"col":"L","slot":0},{"n":"107","sheet":14,"row":2,"col":"L","slot":2},{"n":"108","sheet":14,"row":2,"col":"R","slot":3},{"n":"109","sheet":14,"row":3,"col":"L","slot":4},{"n":"110","sheet":14,"row":3,"col":"R","slot":5},{"n":"111","sheet":14,"row":4,"col":"L","slot":6},{"n":"112","sheet":14,"row":4,"col":"R","slot":7},{"n":"113","sheet":15,"row":1,"col":"L","slot":0},{"n":"114","sheet":15,"row":1,"col":"R","slot":1},{"n":"115","sheet":15,"row":2,"col":"L","slot":2},{"n":"116","sheet":15,"row":2,"col":"R","slot":3},{"n":"117","sheet":15,"row":3,"col":"L","slot":4},{"n":"118","sheet":15,"row":3,"col":"R","slot":5},{"n":"119","sheet":15,"row":4,"col":"L","slot":6},{"n":"120","sheet":15,"row":4,"col":"R","slot":7}];
const KEY = "reunion-checkin-v1";

const Store = {
  mode: "memory", mem: null,
  init(){
    if (window.storage && typeof window.storage.get === "function") { this.mode = "claude"; return; }
    try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); this.mode = "local"; }
    catch (e) { this.mode = "memory"; }
  },
  async get(k){
    if (this.mode === "claude"){ try { const r = await window.storage.get(k); return r && r.value; } catch(e){ return null; } }
    if (this.mode === "local") return localStorage.getItem(k);
    return this.mem;
  },
  async set(k,v){
    if (this.mode === "claude"){ await window.storage.set(k,v); return; }
    if (this.mode === "local"){ localStorage.setItem(k,v); return; }
    this.mem = v;
  }
};

let done = new Set(), filter = "out", q = "", history = [];
const $ = s => document.querySelector(s);
const norm = s => (s||"").toLowerCase();

function grid(slot, campus){
  let cells = "";
  for (let i=0;i<8;i++){
    const x = (i%2)*10, y = Math.floor(i/2)*8, on = i===slot;
    cells += `<rect x="${x}" y="${y}" width="8" height="6" rx="1.2"
      fill="${on?"currentColor":"none"}" stroke="${on?"currentColor":"#3a4557"}" stroke-width="1"/>`;
  }
  return `<svg class="grid" width="18" height="30" viewBox="0 0 18 30"
    style="color:var(--${campus==="navy"?"slate":campus})" aria-hidden="true">${cells}</svg>`;
}

function line(p){
  const bits = [p.label];
  if (p.yrbk) bits.push(`<em>was ${p.yrbk}</em>`);
  if (p.host) bits.push(`guest of ${p.host}`);
  if (p.plus) bits.push(`+1 ${p.plus}`);
  return bits.join(" &middot; ");
}

const match = p => !q || [p.name,p.yrbk,p.host,p.plus,p.n,p.label,p.code].some(v => norm(v).includes(q));

function render(){
  const rows = PEOPLE.filter(p => {
    if (filter==="in"  && !done.has(p.n)) return false;
    if (filter==="out" &&  done.has(p.n)) return false;
    return match(p);
  });

  $("#list").innerHTML = rows.length ? rows.map(p => `
    <button class="row ${p.campus} ${done.has(p.n)?"on":""}" data-n="${p.n}" aria-pressed="${done.has(p.n)}">
      <span class="tick">&#10003;</span>
      <span class="who">
        <span class="nm">${p.name}</span>
        <span class="meta">${line(p)}</span>
      </span>
      <span class="loc">
        ${grid(p.slot, p.campus)}
        <span class="mono"><b>Sheet ${p.sheet}</b>row ${p.row} &middot; ${p.col}<i>${p.code}</i></span>
      </span>
    </button>`).join("")
    : `<div class="empty"><b>${q ? "No one matches that" : (filter==="out" ? "Everyone is here" : "No one checked in yet")}</b>
       ${q ? "Try a maiden name, or a card number." : "Names appear as you check people in."}</div>`;

  const n = done.size, total = PEOPLE.length;
  $("#cHere").textContent = n;
  $("#cOut").textContent = `of ${total} \u00b7 ${total-n} still out`;
  $("#fill").style.width = (total ? n/total*100 : 0) + "%";
}

$("#list").addEventListener("click", e => {
  const row = e.target.closest(".row"); if (!row) return;
  const id = row.dataset.n;
  done.has(id) ? done.delete(id) : done.add(id);
  history.push(id); save(); render();
});
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(o => o.setAttribute("aria-selected", o===t));
  filter = t.dataset.f; render();
}));
$("#q").addEventListener("input", e => { q = norm(e.target.value.trim()); render(); });
$("#undo").addEventListener("click", () => {
  const id = history.pop(); if (!id) return;
  done.has(id) ? done.delete(id) : done.add(id);
  save(); render();
});
$("#reset").addEventListener("click", () => {
  if (!confirm("Clear every check-in? This cannot be undone.")) return;
  done = new Set(); history = []; save(); render();
});
$("#exp").addEventListener("click", () => {
  const here = PEOPLE.filter(p => done.has(p.n)), out = PEOPLE.filter(p => !done.has(p.n));
  $("#expBox").value = "REUNION CHECK-IN \u2014 " + new Date().toLocaleString()
    + "\nHERE (" + here.length + "): " + (here.map(p=>p.name+" #"+p.n).join(", ") || "\u2014")
    + "\n\nSTILL OUT (" + out.length + "): " + (out.map(p=>p.name+" #"+p.n).join(", ") || "\u2014");
  toggle("#expPanel"); $("#expBox").select();
});
$("#bak").addEventListener("click", () => {
  $("#bakBox").value = [...done].sort().join(",");
  toggle("#bakPanel");
});
$("#restore").addEventListener("click", () => {
  const ids = $("#bakBox").value.split(/[^0-9]+/).filter(Boolean).map(s => s.padStart(3,"0"));
  const valid = new Set(PEOPLE.map(p => p.n));
  const keep = ids.filter(i => valid.has(i));
  if (!confirm("Replace the current list with " + keep.length + " checked-in people?")) return;
  done = new Set(keep); history = []; save(); render();
});
function toggle(sel){ const el = $(sel); el.style.display = el.style.display === "block" ? "none" : "block"; }

async function save(){
  try { await Store.set(KEY, JSON.stringify([...done])); }
  catch (e) { warn("Progress isn't saving. Use Backup & restore to keep a copy."); }
}
function warn(msg){ const n = $("#note"); n.textContent = msg; n.style.display = "block"; }

(function blanksInfo(){
  const sheets = [...new Set(BLANKS.map(b => b.sheet))].sort((a,b)=>a-b);
  $("#blankInfo").innerHTML = '<span class="mini">' + BLANKS.length + ' blank tags</span> for anyone not on the list &mdash; '
    + 'sheet' + (sheets.length>1?'s':'') + ' <span class="mini">' + sheets.join(", ") + '</span>. Write the name on with a marker.';
})();

(async function init(){
  Store.init();
  if (Store.mode === "memory") warn("This browser won't save progress. Use Backup & restore before closing.");
  const raw = await Store.get(KEY);
  if (raw) { try { done = new Set(JSON.parse(raw)); } catch(e){} }
  render();
  if ("serviceWorker" in navigator && location.protocol === "https:")
    navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script></body></html>
